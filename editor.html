<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>octのすみか - 記事作成エディタ</title>
  
  <!-- QuillエディタのCSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f9f9f9; color: #333; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], input[type="date"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; }
    #editor-container { height: 400px; background: #fff; }
    
    /* 画像のレスポンシブ対応 ＆ 余白調整 */
    #editor-container .ql-editor img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px auto;
    }

    /* エディタ内の改行・段落（<p>）の余白調整 */
    #editor-container .ql-editor p {
      margin-top: 0;
      margin-bottom: 0.6em;
      line-height: 1.7;
    }

    /* エディタ上の操作ガイド */
    .editor-guide {
      font-size: 0.85rem;
      color: #495057;
      background-color: #e9ecef;
      padding: 8px 12px;
      border-radius: 4px 4px 0 0;
      border-left: 4px solid #007acc;
      margin-bottom: 0;
    }

    .btn { background: #333; color: #fff; border: none; padding: 10px 18px; font-size: 14px; cursor: pointer; border-radius: 4px; }
    .btn:hover { background: #555; }
    .btn-secondary { background: #5c6b73; }
    .btn-secondary:hover { background: #3d484e; }
    .btn-danger { background: #d9534f; }
    .btn-danger:hover { background: #c9302c; }

    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; margin-bottom: 15px; }

    textarea { width: 100%; height: 180px; margin-top: 10px; font-family: monospace; box-sizing: border-box; }
    
    #upload-status { font-weight: bold; color: #007acc; margin-top: 5px; display: none; }
    .config-box { background: #eef2f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    .output-section { margin-top: 30px; }

    /* モーダルスタイル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-header h2 { margin: 0; font-size: 18px; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; }

    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .list-item:last-child { border-bottom: none; }
    .list-item-info { flex: 1; }
    .list-item-title { font-weight: bold; margin-bottom: 4px; }
    .list-item-sub { font-size: 12px; color: #777; }
    .list-item-actions { display: flex; gap: 8px; }

    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
    .image-card { border: 1px solid #ccc; border-radius: 4px; overflow: hidden; background: #fff; text-align: center; padding: 5px; }
    .image-card img { width: 100%; height: 90px; object-fit: cover; display: block; border-radius: 2px; }
    .image-card-title { font-size: 11px; word-break: break-all; margin: 4px 0; color: #555; height: 28px; overflow: hidden; }
    .image-card-btns { display: flex; gap: 4px; justify-content: center; }
    .image-card-btns button { font-size: 10px; padding: 4px 6px; }
  </style>
</head>
<body>

  <h1>octのすみか 記事作成エディタ</h1>

  <!-- ★GitHub設定エリア（画面から安全に入力・保存）★ -->
  <div class="config-box">
    <div class="input-group">
      <label>GitHub Personal Access Token (PAT)</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
    </div>
    <div class="input-group" style="display: flex; gap: 10px; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 150px;">
        <label>ユーザー名</label>
        <input type="text" id="gh-user" value="oct-composer">
      </div>
      <div style="flex: 1; min-width: 150px;">
        <label>リポジトリ名</label>
        <input type="text" id="gh-repo" value="blog-images">
      </div>
      <div style="flex: 1; min-width: 150px;">
        <label>画像フォルダ</label>
        <input type="text" id="gh-folder" value="images">
      </div>
    </div>
    <button type="button" class="btn" onclick="saveSettings()" style="font-size: 13px; padding: 6px 12px;">設定をブラウザに保存</button>
  </div>

  <!-- 操作アクションバー -->
  <div class="action-bar">
    <button type="button" class="btn btn-secondary" onclick="saveDraftToGitHub()">下書き保存 (GitHub)</button>
    <button type="button" class="btn btn-secondary" onclick="openDraftModal()">下書き一覧・読み込み</button>
    <button type="button" class="btn btn-secondary" onclick="openImageLibraryModal()">画像ライブラリ参照</button>
  </div>

  <div class="input-group">
    <label>カテゴリ（タグ）</label>
    <input type="text" id="category" value="Instruments / Guitar">
  </div>

  <div class="input-group">
    <label>日付</label>
    <input type="date" id="date" value="2026-10-07">
  </div>

  <div class="input-group">
    <label>記事タイトル</label>
    <input type="text" id="title" placeholder="例：【機材コラム】Bacchus WINDY-STD/RSMを3年半愛用した感想">
  </div>

  <div class="input-group">
    <label>記事URL（ファイル名）</label>
    <input type="text" id="filename" placeholder="例：bacchus-windy.html">
  </div>

  <div class="input-group">
    <label>サムネイル画像URL（本文に画像を挿入すると自動入力されるよ）</label>
    <input type="text" id="thumbnail" placeholder="例：../resources/equipment/bacchus-windy-eyecatch.webp">
  </div>

  <div class="input-group">
    <label>記事の概要文（indexページのカードに表示される説明文）</label>
    <input type="text" id="excerpt" placeholder="例：使い始めて3年半になるエレキギター「Bacchus WINDY-STD/RSM BGM」を本音レビュー。">
  </div>

  <!-- 本文エディタ -->
  <div class="input-group">
    <label>本文エディタ</label>
    <!-- 操作ガイド表示 -->
    <div class="editor-guide">
      💡 <strong>改行のコツ:</strong> 行を変えたいときは <code>Shift + Enter</code>（詰めて改行） / 段落を変えたいときは <code>Enter</code>（少し余白が入る）
    </div>
    <div id="editor-container"></div>
    <div id="upload-status">処理中...</div>
  </div>

  <div class="action-bar">
    <button class="btn" onclick="generateHTML()">完成したHTMLを出力する</button>
    <button class="btn" onclick="downloadHTMLFile()" style="background: #2b8a3e;">HTMLファイルを直接ダウンロード</button>
  </div>

  <div class="output-section">
    <h3>① 個別記事用HTML（作成したHTMLファイルに保存）</h3>
    <textarea id="output" readonly></textarea>

    <h3>② index.html 追加用カードHTML（一覧ページの journalGrid の中に貼り付け）</h3>
    <textarea id="output-card" readonly></textarea>
  </div>

  <!-- ★下書き管理モーダル★ -->
  <div id="draft-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>下書き一覧 (GitHub/drafts)</h2>
        <button class="modal-close" onclick="closeDraftModal()">&times;</button>
      </div>
      <div id="draft-list-container">読み込み中...</div>
    </div>
  </div>

  <!-- ★画像ライブラリモーダル★ -->
  <div id="image-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>GitHub画像ライブラリ</h2>
        <button class="modal-close" onclick="closeImageLibraryModal()">&times;</button>
      </div>
      <div id="image-library-container">読み込み中...</div>
    </div>
  </div>

  <!-- Quill本体 ＆ リサイズ用ライブラリ -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>

  <script>
    // --- 設定のローカルストレージ自動読み込み＆保存 ---
    const tokenInput = document.getElementById('gh-token');
    const userInput = document.getElementById('gh-user');
    const repoInput = document.getElementById('gh-repo');
    const folderInput = document.getElementById('gh-folder');

    tokenInput.value = localStorage.getItem('oct_gh_token') || '';
    userInput.value = localStorage.getItem('oct_gh_user') || 'oct-composer';
    repoInput.value = localStorage.getItem('oct_gh_repo') || 'blog-images';
    folderInput.value = localStorage.getItem('oct_gh_folder') || 'images';

    function saveSettings() {
      localStorage.setItem('oct_gh_token', tokenInput.value);
      localStorage.setItem('oct_gh_user', userInput.value);
      localStorage.setItem('oct_gh_repo', repoInput.value);
      localStorage.setItem('oct_gh_folder', folderInput.value);
      alert('設定を保存したよ！');
    }

    // ★ Quillのリンク機能で target="_blank" を付与しないようにカスタマイズ
    var Link = Quill.import('formats/link');
    class CustomLink extends Link {
      static create(value) {
        let node = super.create(value);
        node.removeAttribute('target');
        return node;
      }
    }
    Quill.register(CustomLink, true);

    // Quillの初期化
    var quill = new Quill('#editor-container', {
      theme: 'snow',
      modules: {
        imageResize: { displaySize: true },
        toolbar: [
          [{ 'header': [2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'color': [] }, { 'background': [] }],
          [{ 'align': [] }],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['image', 'video', 'link'],
          ['clean']
        ]
      }
    });

    // YouTube URLの埋め込み形式変換関数
    function formatYouTubeUrl(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) 
        ? 'https://www.youtube.com/embed/' + match[2]
        : url;
    }

    // YouTube挿入（videoハンドラ）の挙動カスタマイズ
    quill.getModule('toolbar').addHandler('video', function() {
      let url = prompt('YouTube動画のURLを入力してください:');
      if (url) {
        const embedUrl = formatYouTubeUrl(url);
        const range = quill.getSelection(true);
        quill.insertEmbed(range.index, 'video', embedUrl, Quill.sources.USER);
        quill.setSelection(range.index + 1, Quill.sources.SILENT);
      }
    });

    // --- 画像WebP最適化処理 ---
    function compressAndConvertToWebP(file, maxWidth = 1200, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (blob) {
                resolve(blob);
              } else {
                reject(new Error('WebP変換に失敗しました。'));
              }
            }, 'image/webp', quality);
          };
          img.onerror = (err) => reject(err);
          img.src = e.target.result;
        };
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
      });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onload = () => resolve(reader.result);
        reader.onerror = (err) => reject(err);
      });
    }

    // ★画像ボタンのカスタム処理
    quill.getModule('toolbar').addHandler('image', function() {
      var token = tokenInput.value;
      var user = userInput.value;
      var repo = repoInput.value;
      var folder = folderInput.value;

      if (!token) {
        alert('画像アップロード用に、上の設定エリアにAccess Tokenを入力して保存してね！');
        return;
      }

      var input = document.createElement('input');
      input.setAttribute('type', 'file');
      input.setAttribute('accept', 'image/*');
      input.click();

      input.onchange = async function() {
        var file = input.files[0];
        if (!file) return;

        var statusEl = document.getElementById('upload-status');
        statusEl.innerText = "画像を最適化中 (WebP変換)...";
        statusEl.style.display = 'block';

        try {
          var webpBlob = await compressAndConvertToWebP(file, 1200, 0.8);

          statusEl.innerText = "画像をGitHubへアップロード中...";
          var baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          var cleanName = baseName.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_\-]/g, '');
          var fileName = Date.now() + "_" + (cleanName || "img") + ".webp";
          var filePath = folder ? `${folder}/${fileName}` : fileName;

          var base64Content = await blobToBase64(webpBlob);
          var cleanBase64 = base64Content.replace(/^data:image\/\w+;base64,/, "");

          var url = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;
          var response = await fetch(url, {
            method: 'PUT',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `Upload image (WebP): ${fileName}`,
              content: cleanBase64
            })
          });

          if (response.ok) {
            var rawImageUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${filePath}`;
            
            var range = quill.getSelection(true);
            quill.insertEmbed(range.index, 'image', rawImageUrl);

            var thumbInput = document.getElementById('thumbnail');
            if (!thumbInput.value) {
              thumbInput.value = rawImageUrl;
            }

            alert("画像のWebP変換＆アップロードが完了しました！");
          } else {
            var errData = await response.json();
            alert("アップロード失敗: " + errData.message);
          }
        } catch (err) {
          alert("エラーが発生しました: " + err.message);
        } finally {
          statusEl.style.display = 'none';
        }
      };
    });

    // --- 1. GitHub連携 下書き保存 ＆ 管理 ---
    async function saveDraftToGitHub() {
      var token = tokenInput.value;
      var user = userInput.value;
      var repo = repoInput.value;

      if (!token) {
        alert('下書き保存用にAccess Tokenを入力して保存してね！');
        return;
      }

      var filename = document.getElementById('filename').value.trim();
      if (!filename) {
        alert('記事URL（ファイル名）を入力してね。（例: bacchus-windy.html）');
        return;
      }

      var draftId = filename.replace(/\.html$/i, '') + '.json';
      var filePath = `drafts/${draftId}`;

      var draftData = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        date: document.getElementById('date').value,
        filename: filename,
        thumbnail: document.getElementById('thumbnail').value,
        excerpt: document.getElementById('excerpt').value,
        content: quill.root.innerHTML,
        updatedAt: new Date().toISOString()
      };

      var statusEl = document.getElementById('upload-status');
      statusEl.innerText = "下書きをGitHubへ保存中...";
      statusEl.style.display = 'block';

      try {
        var url = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;

        var sha = null;
        var checkRes = await fetch(url, {
          headers: { 'Authorization': `token ${token}` }
        });
        if (checkRes.ok) {
          var checkData = await checkRes.json();
          sha = checkData.sha;
        }

        var jsonString = JSON.stringify(draftData, null, 2);
        var utf8Bytes = new TextEncoder().encode(jsonString);
        var binary = '';
        utf8Bytes.forEach(b => binary += String.fromCharCode(b));
        var base64Content = btoa(binary);

        var bodyObj = {
          message: `Save draft: ${draftId}`,
          content: base64Content
        };
        if (sha) bodyObj.sha = sha;

        var response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyObj)
        });

        if (response.ok) {
          alert('下書きをGitHubへ自動保存したよ！');
        } else {
          var errData = await response.json();
          alert('下書き保存失敗: ' + errData.message);
        }
      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
      } finally {
        statusEl.style.display = 'none';
      }
    }

    function openDraftModal() {
      document.getElementById('draft-modal').style.display = 'flex';
      fetchDraftList();
    }

    function closeDraftModal() {
      document.getElementById('draft-modal').style.display = 'none';
    }

    async function fetchDraftList() {
      var token = tokenInput.value;
      var user = userInput.value;
      var repo = repoInput.value;
      var container = document.getElementById('draft-list-container');
      container.innerHTML = "下書き一覧を取得中...";

      if (!token) {
        container.innerHTML = "Access Tokenが設定されていません。";
        return;
      }

      try {
        var url = `https://api.github.com/repos/${user}/${repo}/contents/drafts`;
        var res = await fetch(url, {
          headers: { 'Authorization': `token ${token}` }
        });

        if (!res.ok) {
          if (res.status === 404) {
            container.innerHTML = "下書きはまだ保存されていません。(draftsフォルダ未作成)";
          } else {
            container.innerHTML = "一覧取得エラー: " + res.statusText;
          }
          return;
        }

        var files = await res.json();
        var jsonFiles = files.filter(f => f.name.endsWith('.json'));

        if (jsonFiles.length === 0) {
          container.innerHTML = "保存されている下書きはありません。";
          return;
        }

        var html = '';
        for (var file of jsonFiles) {
          html += `
            <div class="list-item">
              <div class="list-item-info">
                <div class="list-item-title">${file.name}</div>
                <div class="list-item-sub">ファイルサイズ: ${Math.round(file.size / 1024 * 10) / 10} KB</div>
              </div>
              <div class="list-item-actions">
                <button class="btn" style="font-size:12px; padding:6px 10px;" onclick="loadDraft('${file.path}')">復元</button>
                <button class="btn btn-danger" style="font-size:12px; padding:6px 10px;" onclick="deleteDraft('${file.path}', '${file.sha}')">削除</button>
              </div>
            </div>
          `;
        }
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = "エラーが発生しました: " + err.message;
      }
    }

    async function loadDraft(filePath) {
      var token = tokenInput.value;
      var user = userInput.value;
      var repo = repoInput.value;

      try {
        var url = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;
        var res = await fetch(url, {
          headers: { 'Authorization': `token ${token}` }
        });
        if (!res.ok) throw new Error("下書きの取得に失敗しました。");

        var data = await res.json();
        var binary = atob(data.content.replace(/\n/g, ''));
        var bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        var jsonText = new TextDecoder().decode(bytes);
        var draft = JSON.parse(jsonText);

        document.getElementById('title').value = draft.title || '';
        document.getElementById('category').value = draft.category || 'Instruments / Guitar';
        document.getElementById('date').value = draft.date || '';
        document.getElementById('filename').value = draft.filename || '';
        document.getElementById('thumbnail').value = draft.thumbnail || '';
        document.getElementById('excerpt').value = draft.excerpt || '';
        
        if (draft.content) {
          quill.root.innerHTML = draft.content;
        }

        alert('下書きをエディタに復元したよ！');
        closeDraftModal();
      } catch (err) {
        alert('復元エラー: ' + err.message);
      }
    }

    async function deleteDraft(filePath, sha) {
      if (!confirm("この下書きを削除してもよろしいですか？")) return;

      var token = tokenInput.value;
      var user = userInput.value;
      var repo = repoInput.value;

      try {
        var url = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;
        var res = await fetch(url, {
          method: 'DELETE',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Delete draft: ${filePath}`,
            sha: sha
          })
        });

        if (res.ok) {
          alert('下書きを削除したよ！');
          fetchDraftList();
        } else {
          var err = await res.json();
          alert('削除失敗: ' + err.message);
        }
      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
      }
    }

    // --- 2. GitHub画像ライブラリ参照 ＆ ワンタップ挿入 ---
    function openImageLibraryModal() {
      document.getElementById('image-modal').style.display = 'flex';
      fetchImageLibrary();
    }

    function closeImageLibraryModal() {
      document.getElementById('image-modal').style.display = 'none';
    }

    async function fetchImageLibrary() {
      var token = tokenInput.value;
      var user = userInput.value;
      var repo = repoInput.value;
      var folder = folderInput.value;
      var container = document.getElementById('image-library-container');
      container.innerHTML = "画像一覧を取得中...";

      try {
        var url = `https://api.github.com/repos/${user}/${repo}/contents/${folder}`;
        var headers = {};
        if (token) headers['Authorization'] = `token ${token}`;

        var res = await fetch(url, { headers });

        if (!res.ok) {
          container.innerHTML = "画像一覧の取得に失敗しました。";
          return;
        }

        var files = await res.json();
        var imgFiles = files.filter(f => /\.(webp|jpg|jpeg|png|gif)$/i.test(f.name));

        if (imgFiles.length === 0) {
          container.innerHTML = "指定フォルダ内に画像は見つかりませんでした。";
          return;
        }

        var html = '<div class="image-grid">';
        for (var file of imgFiles) {
          var rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${file.path}`;
          html += `
            <div class="image-card">
              <img src="${rawUrl}" alt="${file.name}">
              <div class="image-card-title">${file.name}</div>
              <div class="image-card-btns">
                <button class="btn" style="font-size:10px; padding:3px 6px;" onclick="insertImageToEditor('${rawUrl}')">本文挿入</button>
                <button class="btn btn-secondary" style="font-size:10px; padding:3px 6px;" onclick="setAsThumbnail('${rawUrl}')">サムネ設定</button>
              </div>
            </div>
          `;
        }
        html += '</div>';
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = "エラーが発生しました: " + err.message;
      }
    }

    function insertImageToEditor(url) {
      var range = quill.getSelection(true);
      quill.insertEmbed(range.index, 'image', url);
      closeImageLibraryModal();
    }

    function setAsThumbnail(url) {
      document.getElementById('thumbnail').value = url;
      closeImageLibraryModal();
    }

    // HTML文字列のインデント整形関数
    function indentHTML(html) {
      var tab = '    ';
      var result = '';
      var indent = '';

      var tokens = html.replace(/>\s*</g, '><').split(/(?=<)|(?<=>)/);

      tokens.forEach(function(token) {
        if (!token.trim()) return;

        if (token.match(/^<\//)) {
          indent = indent.substring(tab.length);
        }

        result += indent + token + '\n';

        if (token.match(/^<[^\/]/) && !token.match(/<(?:\/|img|br|hr|input|source)/i) && !token.endsWith('/>')) {
          indent += tab;
        }
      });

      return result.trim();
    }

    // --- HTML出力 ＆ ファイルダウンロード ---
    function generateHTML() {
      var category = document.getElementById('category').value;
      var rawDate = document.getElementById('date').value;
      var dateDot = rawDate ? rawDate.replace(/-/g, '.') : ''; 
      var title = document.getElementById('title').value;
      var filename = document.getElementById('filename').value || 'article.html';
      var thumbnail = document.getElementById('thumbnail').value || 'https://via.placeholder.com/600x338';
      var excerpt = document.getElementById('excerpt').value;
      
      // ★ 過去に作られたHTMLやエディタの既存HTMLから target="_blank" を除去するクリーニング処理
      var bodyHTMLRaw = quill.root.innerHTML.replace(/\s*target="_blank"/gi, '');
      var indentedBodyHTML = indentHTML(bodyHTMLRaw);
      
      var formattedBodyHTML = indentedBodyHTML.split('\n').map(line => '                ' + line).join('\n');

      // ① 個別記事用HTML
      var finalHTML = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}｜octのすみか</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 記事本文内のリンクスタイル指定（青色にならず、周囲と同じ文字色で下線のみ表示） */
        .article-body a {
            color: inherit;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="common-header"></div>

    <div class="container article-container">
        <article>
            <div class="article-header">
                <div class="article-meta">
                    <span class="article-tag">${category}</span>
                    <span class="article-date">${dateDot}</span>
                </div>
                <h1 class="article-title">${title}</h1>
            </div>

            <div id="toc-container" class="glass-panel" style="margin-bottom: 2rem; padding: 1rem 1.5rem;">
                <p style="font-weight: bold; margin-top: 0; margin-bottom: 0.5rem; font-size: 1.1rem;">INDEX</p>
                <ul id="toc-list" style="margin: 0; padding-left: 1.2rem; line-height: 1.8;"></ul>
            </div>
            
            <div class="glass-panel article-body">
${formattedBodyHTML}
            </div>

            <div class="back-link-area">
                <a href="./index.html" class="btn-showmore">≪ Journal List (記事一覧) へ戻る</a>
            </div>
        </article>
    </div>
    <footer>
        <p>&copy; octのすみか</p>
    </footer>

    <script src="header.js"><\/script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const body = document.querySelector('.article-body');
        const tocContainer = document.getElementById('toc-container');
        const tocList = document.getElementById('toc-list');
        if (!body || !tocList || !tocContainer) return;

        const headings = body.querySelectorAll('h2, h3');
        if (headings.length === 0) {
            tocContainer.style.display = 'none';
            return;
        }

        headings.forEach((heading, index) => {
            const id = 'heading-' + index;
            heading.id = id;

            const li = document.createElement('li');
            if (heading.tagName === 'H3') {
                li.style.marginLeft = '1.2rem';
                li.style.listStyleType = 'circle';
            } else {
                li.style.listStyleType = 'disc';
            }

            const a = document.createElement('a');
            a.href = '#' + id;
            a.textContent = heading.textContent;
            a.style.color = 'inherit';
            
            li.appendChild(a);
            tocList.appendChild(li);
        });
    });
    <\/script>
</body>
</html>`.trim();

      // ② index.html 追加用カードHTML
      var cardHTML = `<a href="${filename}" class="glass-panel journal-card">
    <div class="card-thumbnail-wrap">
        <img src="${thumbnail}" alt="${title}" class="card-thumbnail">
    </div>
    <div class="card-content">
        <span class="card-tag">${category}</span>
        <h3 class="card-title">${title}</h3>
        <p class="card-excerpt">${excerpt}</p>
        <span class="card-date">${dateDot}</span>
    </div>
</a>`.trim();

      document.getElementById('output').value = finalHTML;
      document.getElementById('output-card').value = cardHTML;
    }

    // 3. .html ファイル直接ダウンロード
    function downloadHTMLFile() {
      generateHTML();
      var finalHTML = document.getElementById('output').value;
      var filename = document.getElementById('filename').value.trim() || 'article.html';

      if (!filename.endsWith('.html')) {
        filename += '.html';
      }

      var blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
